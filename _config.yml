# Site settings
title: "Agile Development Guide"
longtitle: "Philips Shanghai R&D Agile Operating Manual"
author: "Philips Shanghai R&D"
description: "Agile software development guide for Philips Shanghai R&D Center - integrating industry best practices with Philips PDLM process."

# URL settings
url: "https://lexunliu.github.io"
baseurl: ""

# Theme
remote_theme: sighingnow/jekyll-gitbook

# Collections
collections:
  chapters:
    output: true
    sort_by: order
    permalink: /chapters/:name/

# Sidebar order
ordered_collections:
  - chapters

# Table of contents
toc:
  enabled: true
  h_min: 1
  h_max: 3

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

page_width: 800px

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

defaults:
  - scope:
      path: ""
      type: "chapters"
    values:
      layout: post
